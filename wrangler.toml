name = "chronos-command-system"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Node.js compatibility für @epic-web/totp, jose, etc.
compatibility_flags = ["nodejs_compat"]

# Environment Variables für Pages werden NICHT hier gesetzt!
# Stattdessen: Cloudflare Dashboard → Pages → Settings → Environment variables

# Falls du trotzdem lokale Entwicklung brauchst (dev only):
[vars]
MODE = "oss"
ENABLE_OSS_AI = "true"

# WICHTIG: KEINE Secrets hier!
# SUPABASE_URL und SUPABASE_ANON_KEY werden NUR im Dashboard gesetzt
